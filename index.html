        <div class="meta"><span>Ta contribution : <b>${fmt(T.player)}</b></span><span>Fin dans ${fmtDuration(left)}</span></div>
        <div class="meta"><span>Récompense :</span><span>${rewardHTML(CONFIG.tribe.reward)}</span></div>${claim}</div>
      <div class="panel"><span class="lab">Membres</span>${members}</div>
      <div class="panel"><span class="lab">Ligue des tribus</span>${league}</div>
      <div class="panel feed"><span class="lab">Activité récente</span>${feed}</div>
      <p class="note">Prototype : tribus et membres simulés sur ton téléphone.</p>`);
  },

  /* ----- Fiches (boutique, bâtiment) ----- */
  openShop() { this.sheet = { kind: 'shop' }; $('#sheet')._h = null; this.renderSheet(); this.showSheet(); },
  openBuilding(id) { this.sheet = { kind: 'building', id }; $('#sheet')._h = null; this.renderSheet(); this.showSheet(); },
  showSheet() { $('#sheet').classList.add('on'); $('#sheet-bg').classList.add('on'); },
  closeSheet() { this.sheet = null; $('#sheet').classList.remove('on'); $('#sheet-bg').classList.remove('on'); },
  renderSheet() {
    const sh = this.sheet; if (!sh) return;
    let html = '';
    if (sh.kind === 'shop') html = this.shopHTML();
    else { const b = byId(sh.id); if (!b) { this.closeSheet(); return; } html = this.buildingHTML(b); }
    const el = $('#sheet');
    const scroller = el.querySelector('.scroll'), st = scroller ? scroller.scrollTop : 0;
    if (setHTML(el, html)) {
      el.querySelectorAll('canvas[data-prev]').forEach(cnv => { const [t, l] = cnv.dataset.prev.split(':'); drawPreview(cnv, t, +l); });
      const sc2 = el.querySelector('.scroll'); if (sc2) sc2.scrollTop = st;
    }
  },
  shopHTML() {
    const items = CONFIG.shopOrder.map(type => {
      const def = CONFIG.buildings[type], L = def.levels[0], info = shopInfo(type), n = countType(type), mx = maxType(type);
      return `<div class="item ${info.ok ? '' : 'lock'}"><canvas width="120" height="100" data-prev="${type}:1"></canvas>
        <div class="it"><b>${def.name}</b><small>${def.desc}</small>
          <div class="costs sm">${Object.entries(L.cost).map(([r, v]) => `<span class="cost ${state.res[r] >= v ? '' : 'no'}">${img(r)}${v}</span>`).join('')}<span class="cost">⏱ ${fmtDuration(L.time)}</span></div></div>
        <div style="text-align:center;flex:none"><div style="font-size:11px;font-weight:800;color:#8a7a62;margin-bottom:4px">${n}/${mx}</div>
          <button class="btn sm green" data-act="buy" data-type="${type}" ${info.ok ? '' : 'disabled'}>${info.ok ? 'Choisir' : (info.afford === false ? 'Trop cher' : '—')}</button>
          ${!info.ok && info.afford !== false ? `<div style="font-size:10px;font-weight:700;color:#c0392b;margin-top:4px;max-width:78px">${info.why}</div>` : ''}</div></div>`;
    }).join('');
    return `<div class="sh-head"><div><h3>Construire</h3><div class="lv">Choisis, puis pose-le où tu veux</div></div><button class="xbtn" data-act="close" aria-label="Fermer">×</button></div>
      <div class="scroll">${items}</div>`;
  },
  buildingHTML(b) {
    const def = bdef(b), u = upgradeInfo(b);
    const pips = def.levels.map((_, i) => `<i class="${i < b.level ? 'on' : ''}"></i>`).join('');
    let body = '';
    if (b.build) {
      const left = (b.build.end - now()) / 1000;
      body += `<div class="box"><b>${b.level === 0 ? 'En construction' : `Amélioration au niveau ${b.build.to}`}</b> — encore ${fmtClock(left)}
        <div class="prog"><i style="width:${buildProgress(b) * 100}%"></i></div></div>
        <button class="btn full gold" data-act="finish">Finir maintenant · ${finishCost(b.build.end)} ${img('coquillages')}</button>`;
    } else if (jobRunning(b)) {
      const job = def.jobs.find(j => j.id === b.job.id), left = (b.job.end - now()) / 1000;
      body += `<div class="box"><b>${job ? job.name : 'Production'}</b> — prêt dans ${fmtClock(left)}
        <div class="prog"><i style="width:${jobProgress(b) * 100}%"></i></div>${rewardHTML(b.job.out)}</div>
        <button class="btn full gold" data-act="finish">Finir maintenant · ${finishCost(b.job.end)} ${img('coquillages')}</button>`;
    } else if (jobReady(b)) {
      body += `<div class="box"><b>C'est prêt !</b> ${rewardHTML(b.job.out)}</div><button class="btn full green glow" data-act="collect">Récolter</button>`;
    } else if (def.jobs) {
      body += `<div class="scroll" style="max-height:38vh">${def.jobs.map(j => {
        const out = jobOut(b, j), lock = (j.reqLevel || 1) > villageLevel(), ok = !lock && canAfford(j.cost);
        return `<div class="item ${ok ? '' : 'lock'}"><div class="it"><b>${j.name}</b><small>⏱ ${fmtDuration(j.time)}${lock ? ` · niveau ${j.reqLevel} requis` : ''}</small>
          <div class="costs sm">${Object.entries(j.cost).map(([r, v]) => `<span class="cost ${state.res[r] >= v ? '' : 'no'}">${img(r)}${v}</span>`).join('')}<span class="arrow">→</span>${Object.entries(out).map(([r, v]) => `<span class="cost">${img(r)}${v}</span>`).join('')}</div></div>
          <button class="btn sm green" data-act="job" data-job="${j.id}" ${ok ? '' : 'disabled'}>${b.type === 'champ' ? 'Planter' : 'Lancer'}</button></div>`;
      }).join('')}</div>`;
    }
    if (b.type === 'silo' && b.level > 0) body += `<div class="box">Capacité : <b>${def.levels[b.level - 1].cap}</b> par ressource${u.max ? '' : ` → <b>${u.next.cap}</b> au niveau suivant`}. Les coquillages ne prennent pas de place.</div>`;
    if (b.type === 'case' && b.level > 0) body += `<div class="box">Accueille <b>${def.levels[b.level - 1].villagers}</b> villageois${u.max ? '' : ` → <b>${u.next.villagers}</b> au niveau suivant`}.</div>`;
    let up = '';
    if (!u.max && b.level > 0 && !b.build) {
      up = `<div class="box" style="margin-top:4px"><b>Niveau ${b.level + 1}</b> · ⏱ ${fmtDuration(u.next.time)}${u.next.mult ? ` · gains ×${u.next.mult}` : ''}${costHTML(u.next.cost, true)}${!u.lvlOk ? `<div class="req" style="margin:6px 0 0">Village niveau ${u.req} requis</div>` : ''}</div>`;
    }
    const canUp = !u.max && b.level > 0 && !b.build;
    return `<div class="sh-head"><canvas width="168" height="140" data-prev="${b.type}:${Math.max(1, b.level)}"></canvas>
      <div><h3>${def.name}</h3><div class="lv">${b.level === 0 ? 'En construction' : `Niveau ${b.level}/${def.levels.length}`}</div><div class="pips">${pips}</div></div>
      <button class="xbtn" data-act="close" aria-label="Fermer">×</button></div>
      <p class="desc">${def.desc}</p>${body}${up}
      <div class="actions">${canUp ? `<button class="btn green" data-act="upgrade" ${u.ok ? '' : 'disabled'}>${!u.free ? 'Occupé' : (!u.lvlOk ? `Niveau ${u.req}` : (!u.afford ? 'Trop cher' : 'Améliorer'))}</button>` : ''}
        <button class="btn ghost" data-act="move">Déplacer</button></div>`;
  },
  onSheetClick(e) {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.dataset.act, sh = this.sheet;
    if (act === 'close') { Sound.play('tap'); this.closeSheet(); return; }
    if (act === 'buy') { this.closeSheet(); Sound.play('tap'); World.startPlace(b.dataset.type); return; }
    const bd = sh && sh.kind === 'building' ? byId(sh.id) : null;
    if (!bd) return;
    if (act === 'job') { if (startJob(bd, b.dataset.job)) this.closeSheet(); }
    if (act === 'collect') { collect(bd); }
    if (act === 'upgrade') { if (startUpgrade(bd)) this.closeSheet(); }
    if (act === 'finish') { finishNow(bd.build || bd.job); }
    if (act === 'move') { Sound.play('tap'); World.startMove(bd); return; }
    this.refresh();
  },

  /* ----- Parcelles ----- */
  openParcel(pc, pr) {
    const st = state.parcels[pkey(pc, pr)];
    if (st && st !== 'open') {
      this.modal(`<h2>Défrichage en cours</h2><p>Encore ${fmtDuration((st.end - now()) / 1000)} et c'est fini.</p>`, [
        { label: `Finir maintenant · ${finishCost(st.end)} ${img('coquillages')}`, cls: 'gold', fn: () => finishNow(st) },
        { label: 'Fermer', cls: 'ghost' },
      ]);
      return;
    }
    if (!parcelAdjacentOpen(pc, pr)) { this.toast('Faut défricher à côté d’abord !'); Sound.play('miss'); return; }
    const info = parcelCost(), lvlOk = villageLevel() >= info.reqLevel, ok = lvlOk && canAfford(info.cost);
    this.modal(`<h2>Défricher la brousse ?</h2><p>La brousse elle est épaisse ici. En la défrichant, tu gagnes une nouvelle parcelle pour construire.</p>
      <div class="gains">${Object.entries(info.cost).map(([r, n]) => `<span class="cost ${state.res[r] >= n ? '' : 'no'}">${img(r)}${n}</span>`).join('')}<span class="cost">⏱ ${fmtDuration(info.time)}</span></div>
      ${!lvlOk ? `<p class="req">Village niveau ${info.reqLevel} requis</p>` : ''}`, [
      { label: ok ? 'Défricher' : (lvlOk ? 'Pas assez de ressources' : `Niveau ${info.reqLevel} requis`), cls: ok ? 'green' : 'ghost', fn: ok ? () => startClearing(pc, pr) : null },
      { label: 'Plus tard', cls: 'ghost' },
    ]);
  },

  /* ----- Modales & dialogues ----- */
  modal(html, buttons) {
    this.modalButtons = buttons;
    $('#modal').innerHTML = html + `<div class="mbtns">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
    $('#modal-bg').classList.add('on');
  },
  closeModal() { $('#modal-bg').classList.remove('on'); },
  dialog(v, text, objective, buttons, reward) {
    Sound.play('talk');
    this.modal(`<div class="dlg"><canvas width="152" height="152" id="portrait"></canvas><div><div class="who">${v.def.title || v.def.name}</div><div class="say">${text}</div></div></div>
      ${objective ? `<div class="obj">🎯 ${objective}</div>` : ''}${reward ? `<div class="gains">${rewardHTML(reward)}</div>` : ''}`, buttons);
    const pc = $('#portrait').getContext('2d');
    pc.setTransform(1, 0, 0, 1, 0, 0); pc.translate(76, 168); pc.scale(4.2, 4.2);
    drawVillager(pc, v.def.look, 0, false, 0, false);
  },
  openSettings() {
    const st = state.settings;
    this.modal(`<h2>Paramètres</h2>
      <div class="toggle-row"><span>Son</span><span>${st.sound ? 'Activé' : 'Coupé'}</span></div>
      <div class="toggle-row"><span>Vibrations</span><span>${st.vibrate ? 'Activées' : 'Coupées'}</span></div>
      <p style="margin-top:10px;font-size:12px">Astuce : appui long sur un bâtiment pour le déplacer. Pince pour zoomer.</p>`, [
      { label: st.sound ? 'Couper le son' : 'Activer le son', cls: 'ghost', keep: true, fn: () => { st.sound = !st.sound; this.updateSoundBtn(); save(); this.openSettings(); } },
      { label: st.vibrate ? 'Couper les vibrations' : 'Activer les vibrations', cls: 'ghost', keep: true, fn: () => { st.vibrate = !st.vibrate; save(); vibrate(30); this.openSettings(); } },
      { label: 'Réinitialiser la partie', fn: () => this.confirmReset() },
      { label: 'Fermer', cls: 'green' },
    ]);
  },
  confirmReset() {
    this.modal('<h2>Tout recommencer ?</h2><p>Ton village, tes ressources et ta tribu seront effacés. Cette action est définitive.</p>', [
      { label: 'Oui, réinitialiser', fn: resetGame },
      { label: 'Annuler', cls: 'ghost' },
    ]);
  },
  showOffline(sec, sum) {
    const lines = [];
    if (sum.builds) lines.push(`🔨 ${sum.builds} construction${sum.builds > 1 ? 's' : ''} terminée${sum.builds > 1 ? 's' : ''}`);
    if (sum.ready) lines.push(`🌱 ${sum.ready} récolte${sum.ready > 1 ? 's' : ''} prête${sum.ready > 1 ? 's' : ''} à ramasser`);
    if (sum.parcels) lines.push(`🌿 ${sum.parcels} parcelle${sum.parcels > 1 ? 's' : ''} défrichée${sum.parcels > 1 ? 's' : ''}`);
    if (sum.arrivals) lines.push(`👋 ${sum.arrivals} nouveau${sum.arrivals > 1 ? 'x' : ''} villageois`);
    if (!lines.length) lines.push('Rien de neuf… lance des productions avant de partir !');
    this.modal(`<h2>Bon retour !</h2><p>${TEXTES.retour} (${fmtDuration(sec)})</p><div class="lst">${lines.join('<br>')}</div>`, [
      { label: "On y va !", cls: 'green', fn: () => Sound.play('collect') },
    ]);
  },
  showWelcome() {
    this.modal(`<h2>Bienvenue à Brousse&amp;Co</h2><p>Entre la montagne et le lagon, ton petit village t'attend. Construis, plante, défriche la brousse, pêche, chasse… et écoute ce que disent les villageois !</p><p>Commence par aller voir <b>Tata Rosine</b> (le <b>!</b> jaune).</p>`, [
      { label: "C'est parti !", cls: 'green', fn: () => { Sound.play('start'); const g = questGiver(); if (g) World.centerOn(g.x, g.y - 20); } },
    ]);
  },
};

/* =========================================================
   11. NAVIGATION, BOUCLE DE JEU & DÉMARRAGE
   ========================================================= */
const stage = $('#stage');
let switching = false;
const TABS = ['village', 'peche', 'chasse', 'tribu'];

function setScreen(tab) {
  current = tab;
  document.querySelectorAll('.screen').forEach(el => el.classList.toggle('on', el.id === `scr-${tab}`));
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.tab === tab));
  if (scene().enter) scene().enter();
  UI.refresh();
}
function go(tab) {
  if (tab === current || switching) return;
  if (Fishing.running) Fishing.finish();
  if (Hunting.running) Hunting.finish();
  if (World.placing) World.cancelPlace();
  UI.closeSheet();
  const dir = TABS.indexOf(tab) > TABS.indexOf(current) ? -1 : 1;
  switching = true;
  stage.style.setProperty('--dx', `${dir * 24}px`);
  stage.classList.add('out');
  setTimeout(() => {
    setScreen(tab);
    stage.style.transition = 'none';
    stage.style.setProperty('--dx', `${-dir * 24}px`);
    void stage.offsetWidth;
    stage.style.transition = '';
    stage.classList.remove('out');
    switching = false;
  }, 160);
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, stage.clientWidth); H = Math.max(1, stage.clientHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = clamp(Math.min(W / 390, H / 690), 0.75, 1.5);
  Object.values(SCENES).forEach(sc => sc.layout());
}

// Entrées : le village gère glisser / pincer / appui long ; les mini-jeux réagissent au tap
function localXY(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Sound.unlock();
  const [x, y] = localXY(e);
  if (current === 'village') { try { cv.setPointerCapture(e.pointerId); } catch (er) {} World.pdown(e, x, y); }
  else scene().tap(x, y);
});
cv.addEventListener('pointermove', e => { if (current === 'village') { const [x, y] = localXY(e); World.pmove(e, x, y); } });
const pEnd = e => { if (current === 'village') { const [x, y] = localXY(e); World.pup(e, x, y); } };
cv.addEventListener('pointerup', pEnd);
cv.addEventListener('pointercancel', e => { World.ptrs.delete(e.pointerId); World.drag = null; World.pinch = null; clearTimeout(World.longT); });
cv.addEventListener('wheel', e => { e.preventDefault(); if (current === 'village') { const [x, y] = localXY(e); World.wheel(e, x, y); } }, { passive: false });
document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
// Sécurité : la page ne doit jamais défiler (focus clavier, navigateurs anciens…)
['#app', '#stage'].forEach(sel => { const el = $(sel); el.addEventListener('scroll', () => { el.scrollTop = 0; el.scrollLeft = 0; }); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = now(); save(); return; }
  if (!hiddenAt) return;
  const sec = (now() - hiddenAt) / 1000; hiddenAt = 0;
  TribeService.tick(Math.min(sec, 8 * 3600));
  last = performance.now();
});
window.addEventListener('pagehide', save);

let last = performance.now(), GT = 0, uiAcc = 0, saveAcc = 0, timerAcc = 0;
function frame(nowMs) {
  const dt = Math.min(0.1, Math.max(0, (nowMs - last) / 1000));
  last = nowMs; GT += dt;
  TribeService.tick(dt);
  timerAcc += dt; if (timerAcc >= 0.25) { timerAcc = 0; checkTimers(false); }
  scene().update(dt);
  if (current !== 'village') Villagers.update(dt);     // les villageois continuent leur vie pendant les mini-jeux
  ctx.clearRect(0, 0, W, H);
  scene().draw(GT);
  uiAcc += dt; if (uiAcc >= 0.2) { uiAcc = 0; UI.refresh(); }
  saveAcc += dt; if (saveAcc >= CONFIG.autosaveSec) { saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}

function init() {
  const loaded = load();
  state = loaded.state;
  if (state.cam) { World.cam.x = state.cam.x; World.cam.y = state.cam.y; World.cam.z = state.cam.z; }
  buildIconImages();
  UI.init();
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener('resize', resize);

  // Résumé de l'absence (avant d'appliquer les minuteurs)
  const t = now(), away = (t - state.lastTime) / 1000;
  const sum = {
    builds: state.buildings.filter(b => b.build && t >= b.build.end).length,
    ready: state.buildings.filter(b => b.job && t >= b.job.end).length,
    parcels: Object.values(state.parcels).filter(p => p !== 'open' && t >= p.end).length,
  };
  Villagers.respawnAll();
  const before = state.villagers;
  checkTimers(true);
  sum.arrivals = state.villagers - before;
  TribeService.tick(Math.min(away, 8 * 3600));

  if (loaded.isNew) {
    UI.showWelcome();
    const p = World.villageCenter(); World.cam.x = p.x; World.cam.y = p.y; World.clampCam();
  } else if (away >= CONFIG.offlineMinSec) UI.showOffline(away, sum);
  setScreen('village');
  save();
  last = performance.now();
  requestAnimationFrame(frame);
}
init();
</script>
