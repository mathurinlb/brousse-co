const SCENES = { village: Village, peche: Fishing, chasse: Hunting, tribu: TribeScene };
let current = 'village';
const scene = () => SCENES[current];

/* =========================================================
   9. INTERFACE (barre du haut, fiches, cartes, tribu, modales)
   ========================================================= */
const SOUND_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SOUND_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';

function setHTML(el, html) { if (el._h !== html) { el.innerHTML = html; el._h = html; return true; } return false; }
const img = r => `<img src="${ICON[r]}" alt="">`;
const rewardHTML = rew => Object.entries(rew).map(([r, n]) => `<span class="rw">${img(r)}+${n}</span>`).join('');

const UI = {
  resEls: {}, sheetId: null,

  init() {
    // Barre de ressources
    const bar = $('#res');
    bar.innerHTML = RES_ORDER.map(r => `<div class="chip" data-r="${r}" title="${CONFIG.resources[r].name}"><img src="${ICON[r]}" alt=""><span>0</span></div>`).join('');
    RES_ORDER.forEach(r => { this.resEls[r] = bar.querySelector(`[data-r="${r}"] span`); });
    document.querySelectorAll('img[data-icon]').forEach(el => { el.src = ICON[el.dataset.icon]; });

    // Onglets
    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { Sound.play('tap'); go(b.dataset.tab); }));

    // Son + paramètres
    this.updateSoundBtn();
    $('#btn-sound').addEventListener('click', () => {
      state.settings.sound = !state.settings.sound; this.updateSoundBtn(); Sound.play('tap'); save();
    });
    $('#btn-set').addEventListener('click', () => { Sound.play('tap'); this.openSettings(); });

    // Quête (délégation d'événements)
    $('#quest').addEventListener('click', e => { if (e.target.closest('[data-act="claim"]')) claimQuest(); });

    // Cartes des mini-jeux
    for (const sc of [Fishing, Hunting]) {
      $(`#${sc.kind}-card`).addEventListener('click', e => {
        const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
        if (b.dataset.act === 'start') sc.start();
        if (b.dataset.act === 'ok') { sc.mode = 'intro'; Sound.play('tap'); }
        this.refresh();
      });
    }

    // Fiche bâtiment
    $('#sheet-bg').addEventListener('click', () => this.closeSheet());
    $('#sheet').addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
      if (b.dataset.act === 'close') { Sound.play('tap'); this.closeSheet(); }
      if (b.dataset.act === 'upgrade' && this.sheetId) { if (upgrade(this.sheetId)) this.closeSheet(); }
    });

    // Tribu
    $('#tribu').addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'join' && TribeService.join(b.dataset.id)) {
        Sound.play('quest'); vibrate(30); this.toast(`Bienvenue dans la ${state.tribe.name} !`); save();
      }
      if (b.dataset.act === 'claim') {
        const rew = TribeService.claim();
        if (rew) { giveReward(rew); addXp(CONFIG.xp.tribeGoal); Sound.play('level'); vibrate([30, 40, 30]); this.toast('Défi réussi, bravo la tribu !'); save(); }
      }
      this.refresh();
    });

    // Modale
    $('#modal').addEventListener('click', e => {
      const b = e.target.closest('button[data-i]'); if (!b) return;
      const def = this.modalButtons[+b.dataset.i];
      Sound.play('tap');
      if (!def.keep) this.closeModal();
      if (def.fn) def.fn();
    });
  },

  updateSoundBtn() { $('#btn-sound').innerHTML = state.settings.sound ? SOUND_ON : SOUND_OFF; },

  bump(r) {
    const el = document.querySelector(`.chip[data-r="${r}"]`); if (!el) return;
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  },

  toast(txt) {
    const t = $('#toast'); t.textContent = txt; t.classList.add('on');
    clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('on'), 2200);
  },

  // Rafraîchissement de l'interface (≈ 5 fois par seconde)
  refresh() {
    for (const r of RES_ORDER) { const v = fmt(state.res[r]); if (this.resEls[r].textContent !== v) this.resEls[r].textContent = v; }
    $('#lvl').textContent = `Niv. ${villageLevel()}`;
    $('#xp').style.width = `${Math.round(xpProgress() * 100)}%`;
    $('#pop').textContent = `${Math.floor(state.pop)}/${popMax()}`;

    const qs = questState();
    if (qs && qs.done && state.quest.notified !== state.quest.index) { state.quest.notified = state.quest.index; Sound.play('collect'); }
    $('#dot-village').classList.toggle('on', !!(qs && qs.done));
    $('#dot-tribu').classList.toggle('on', TribeService.canClaim() || (!TribeService.isJoined() && state.quest.index >= 4));

    if (current === 'village') this.renderQuest(qs);
    if (current === 'peche') this.renderMg(Fishing);
    if (current === 'chasse') this.renderMg(Hunting);
    if (current === 'tribu') this.renderTribe();
    if (this.sheetId) this.renderSheet();
  },

  renderQuest(qs) {
    const el = $('#quest');
    $('#hint').classList.toggle('hide', state.stats.built > 0);
    if (!qs) { el.classList.add('hide'); return; }
    el.classList.remove('hide');
    const right = qs.done
      ? `<button class="btn sm green glow" data-act="claim">Réclamer</button>`
      : `<div>${rewardHTML(qs.q.reward)}</div>`;
    setHTML(el, `<div class="qt"><small>Quête ${state.quest.index + 1}/${CONFIG.quests.length}</small><b>${qs.q.text}</b>
      <div class="qbar"><i style="width:${Math.round(qs.p / qs.q.n * 100)}%"></i></div></div>${right}`);
  },

  renderMg(sc) {
    const kind = sc.kind, isF = kind === 'peche', cfg = isF ? CONFIG.fishing : CONFIG.hunting;
    const hud = $(`#${kind}-hud`), card = $(`#${kind}-card`);
    hud.classList.toggle('on', sc.running);
    card.classList.toggle('hide', sc.running);
    if (sc.running) {
      $(`#${kind}-time`).style.width = `${clamp(sc.left / cfg.duration, 0, 1) * 100}%`;
      $(`#${kind}-score`).textContent = sc.score;
      return;
    }
    const res = isF ? 'poisson' : 'gibier';
    if (sc.mode === 'result' && sc.result) {
      const r = sc.result;
      setHTML(card, `<h2>${isF ? 'Belle pêche !' : 'Belle chasse !'}</h2>
        ${r.record ? '<div class="record">Nouveau record !</div>' : ''}
        <div class="big">${img(res)}+${r.score}</div>
        ${r.shells ? `<p>Bonus : <span class="rw">${img('coquillages')}+${r.shells}</span></p>` : '<p>&nbsp;</p>'}
        <button class="btn full ${isF ? 'blue' : 'green'}" data-act="ok">Continuer</button>`);
      return;
    }
    const cd = Math.max(0, Math.ceil((state.cooldown[kind] - Date.now()) / 1000));
    const rules = isF
      ? "Le banc de poissons se déplace sur le lagon. Tape sur l'eau pour lancer l'épervier : il met un instant à tomber, alors anticipe sa course !"
      : "Cerfs, cochons sauvages et notous se montrent un court instant dans les buissons et les niaoulis. Tape-les avant qu'ils ne s'enfuient !";
    setHTML(card, `<h2>${isF ? 'Pêche au lagon' : 'Chasse en brousse'}</h2><p>${rules}</p>
      <p class="small">Record : <b>${state.best[kind]}</b> ${img(res).replace('<img', '<img style="width:16px;height:16px;vertical-align:-3px"')} · ${cfg.duration} s</p>
      <button class="btn full ${isF ? 'blue' : 'green'}" data-act="start" ${cd ? 'disabled' : ''}>${cd ? `Repos encore ${cd} s` : 'Commencer'}</button>`);
  },

  renderTribe() {
    const el = $('#tribu');
    if (!TribeService.isJoined()) {
      setHTML(el, `<div class="panel"><h2>Rejoins une tribu</h2><p>Ensemble, relevez un défi chaque semaine et grimpez dans la ligue des tribus.</p></div>
        ${TribeService.getChoices().map(c => `<div class="panel trow"><span class="badge" style="background:${c.color}">${c.name.split(' ').pop()[0]}</span>
          <div class="tc"><b>${c.name}</b><small>${c.motto}</small></div>
          <button class="btn sm green" data-act="join" data-id="${c.id}">Rejoindre</button></div>`).join('')}
        <p class="note">Prototype : tribus et membres simulés sur ton téléphone.</p>`);
      return;
    }
    const T = state.tribe, tot = TribeService.total(), pct = Math.min(100, Math.round(tot / T.goal.target * 100));
    const left = Math.max(0, (T.weekEnd - Date.now()) / 1000);
    const claim = TribeService.canClaim()
      ? `<button class="btn full green glow" data-act="claim">Récupérer la récompense</button>`
      : (T.claimed ? '<div class="ok">Récompense récupérée ✔</div>' : `<p>${T.goal.hint}</p>`);
    const members = TribeService.getMembers().map(m => `<div class="li ${m.me ? 'me' : ''}"><span class="nm">${m.name}</span><span class="vl">${fmt(m.c)}</span>${img(T.goal.res).replace('<img', '<img style="width:18px;height:18px"')}</div>`).join('');
    const league = TribeService.getLeague().map((t, i) => `<div class="li ${t.me ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="badge sm" style="background:${t.color}">${t.name.split(' ').pop()[0]}</span><span class="nm">${t.name}</span><span class="vl">${fmt(t.score)}</span></div>`).join('');
    const feed = (T.feed || []).slice(0, 4).map(f => `<div class="li">${f.who} a apporté ${f.n} ${CONFIG.resources[T.goal.res].name}</div>`).join('') || '<div class="li">Pas encore d’activité cette semaine.</div>';
    setHTML(el, `<div class="panel trow"><span class="badge" style="background:${T.color}">${T.name.split(' ').pop()[0]}</span><div class="tc"><small>Ta tribu</small><b>${T.name}</b></div></div>
      <div class="panel"><span class="lab">Défi de la semaine</span><b>${T.goal.label}</b>
        <div class="bigbar"><i style="width:${pct}%"></i><span>${fmt(tot)} / ${T.goal.target}</span></div>
        <div class="meta"><span>Ta contribution : <b>${fmt(T.player)}</b></span><span>Fin dans ${fmtDuration(left)}</span></div>
        <div class="meta"><span>Récompense :</span><span>${rewardHTML(CONFIG.tribe.reward)}</span></div>
        ${claim}</div>
      <div class="panel"><span class="lab">Membres</span>${members}</div>
      <div class="panel"><span class="lab">Ligue des tribus</span>${league}</div>
      <div class="panel feed"><span class="lab">Activité récente</span>${feed}</div>
      <p class="note">Prototype : tribus et membres simulés sur ton téléphone.</p>`);
  },

  // ----- Fiche bâtiment -----
  openSheet(id) {
    this.sheetId = id; $('#sheet')._h = null; this.renderSheet();
    $('#sheet').classList.add('on'); $('#sheet-bg').classList.add('on');
  },
  closeSheet() {
    this.sheetId = null; $('#sheet').classList.remove('on'); $('#sheet-bg').classList.remove('on');
  },
  effectText(def, L) {
    if (!L) return '—';
    if (def.produces) return `<b>${fmtRate(L.rate * prodMult())}</b> ${CONFIG.resources[def.produces].name} / s`;
    if (def.converts) return `<b>${L.ratio}</b> poissons ou gibiers → <b>${L.out}</b> provision${L.out > 1 ? 's' : ''} toutes les ${Math.round(1 / L.rate)} s`;
    if (L.pop) return `<b>+${L.pop}</b> habitants max`;
    return '';
  },
  renderSheet() {
    const id = this.sheetId, s = SLOT[id], st = state.slots[id], def = CONFIG.buildings[s.type], u = upgradeInfo(id);
    const curL = st.level > 0 ? def.levels[st.level - 1] : null;
    let body = `<div class="eff">${st.level > 0 ? `Actuel : ${this.effectText(def, curL)}<br>` : ''}${u.max ? 'Niveau maximum atteint.' : `${st.level > 0 ? 'Prochain' : 'Effet'} : ${this.effectText(def, u.next)}`}</div>`;
    if (!u.max) {
      body += `<div class="costs">${Object.entries(u.next.cost).map(([r, n]) => `<span class="cost ${state.res[r] >= n ? '' : 'no'}">${img(r)}${n}</span>`).join('')}</div>`;
      if (!u.lvlOk) body += `<div class="req">Nécessite le village niveau ${u.req}</div>`;
      const label = !u.lvlOk ? `Niveau ${u.req} requis` : (!u.afford ? 'Ressources insuffisantes' : (st.level === 0 ? 'Construire' : `Améliorer au niveau ${st.level + 1}`));
      body += `<button class="btn full green" data-act="upgrade" ${u.ok ? '' : 'disabled'}>${label}</button>`;
    } else {
      body += `<button class="btn full ghost" data-act="close">Fermer</button>`;
    }
    const pips = def.levels.map((_, i) => `<i class="${i < st.level ? 'on' : ''}"></i>`).join('');
    const html = `<div class="sh-head"><canvas id="sh-cv" width="192" height="160"></canvas>
      <div><h3>${def.name}</h3><div class="lv">${st.level === 0 ? 'Pas encore construit' : `Niveau ${st.level}/${def.levels.length}`}</div><div class="pips">${pips}</div></div>
      <button class="xbtn" data-act="close" aria-label="Fermer">×</button></div>
      <p class="desc">${def.desc}</p>${body}`;
    if (setHTML($('#sheet'), html)) {
      const pc = $('#sh-cv').getContext('2d');
      pc.setTransform(2, 0, 0, 2, 0, 0);
      const lv = Math.max(1, st.level);
      if (s.type === 'ponton') {
        pc.fillStyle = '#2bb3cf'; pc.fillRect(0, 22, 96, 58); pc.fillStyle = '#f1dca2'; pc.fillRect(0, 16, 96, 8);
        drawBuilding(pc, 'ponton', lv, 48, 20, 0.62, 0);
      } else {
        drawBuilding(pc, s.type, lv, 48, 70, s.type === 'atelier' ? 0.7 : 0.85, 0);
      }
    }
  },

  // ----- Modales -----
  modal(html, buttons) {
    this.modalButtons = buttons;
    $('#modal').innerHTML = html + `<div class="mbtns">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
    $('#modal-bg').classList.add('on');
  },
  closeModal() { $('#modal-bg').classList.remove('on'); },
  openSettings() {
    const st = state.settings;
    this.modal(`<h2>Paramètres</h2>
      <div class="toggle-row"><span>Son</span><span>${st.sound ? 'Activé' : 'Coupé'}</span></div>
      <div class="toggle-row"><span>Vibrations</span><span>${st.vibrate ? 'Activées' : 'Coupées'}</span></div>`, [
      { label: st.sound ? 'Couper le son' : 'Activer le son', cls: 'ghost', keep: true, fn: () => { st.sound = !st.sound; this.updateSoundBtn(); save(); this.openSettings(); } },
      { label: st.vibrate ? 'Couper les vibrations' : 'Activer les vibrations', cls: 'ghost', keep: true, fn: () => { st.vibrate = !st.vibrate; save(); vibrate(30); this.openSettings(); } },
      { label: 'Réinitialiser la partie', fn: () => this.confirmReset() },
      { label: 'Fermer', cls: 'green' },
    ]);
  },
  confirmReset() {
    this.modal('<h2>Tout recommencer ?</h2><p>Ton village, tes ressources et ta tribu seront effacés. Cette action est définitive.</p>', [
      { label: 'Oui, réinitialiser', fn: resetGame },
      { label: 'Annuler', cls: 'ghost' },
    ]);
  },
  showOffline(sec, gains) {
    const list = Object.entries(gains).map(([r, n]) => `<span class="rw ${n < 0 ? 'neg' : ''}">${img(r)}${n > 0 ? '+' : ''}${fmt(n < 0 ? -n : n).replace(/^/, n < 0 ? '−' : '')}</span>`).join('');
    const capped = sec >= CONFIG.offlineCapHours * 3600;
    this.modal(`<h2>Bon retour !</h2><p>Pendant ton absence (${fmtDuration(sec)}${capped ? ', plafonné à ' + CONFIG.offlineCapHours + ' h' : ''}), le village a travaillé :</p>
      <div class="gains">${list || '<span>Rien de neuf… construis des bâtiments pour produire !</span>'}</div>`, [
      { label: 'Récolter', cls: 'green', fn: () => { Sound.play('collect'); Object.keys(gains).forEach(r => this.bump(r)); } },
    ]);
  },
  showWelcome() {
    this.modal(`<h2>Bienvenue à Brousse&amp;Co</h2><p>Entre lagon et montagne, développe ton village : construis des cases, cultive les ignames, pêche au lagon, chasse en brousse et rejoins une tribu.</p><p>Commence par construire ta première case !</p>`, [
      { label: "C'est parti !", cls: 'green', fn: () => Sound.play('start') },
    ]);
  },
};

/* =========================================================
   10. NAVIGATION, BOUCLE DE JEU & DÉMARRAGE
   ========================================================= */
const stage = $('#stage');
let switching = false;
const TABS = ['village', 'peche', 'chasse', 'tribu'];

function setScreen(tab) {
  current = tab;
  document.querySelectorAll('.screen').forEach(el => el.classList.toggle('on', el.id === `scr-${tab}`));
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.tab === tab));
  if (scene().enter) scene().enter();
  UI.refresh();
}
function go(tab) {
  if (tab === current || switching) return;
  if (Fishing.running) Fishing.finish();          // quitter un mini-jeu = on garde les prises
  if (Hunting.running) Hunting.finish();
  UI.closeSheet();
  const dir = TABS.indexOf(tab) > TABS.indexOf(current) ? -1 : 1;
  switching = true;
  stage.style.setProperty('--dx', `${dir * 24}px`);
  stage.classList.add('out');
  setTimeout(() => {
    setScreen(tab);
    stage.style.transition = 'none';
    stage.style.setProperty('--dx', `${-dir * 24}px`);
    void stage.offsetWidth;
    stage.style.transition = '';
    stage.classList.remove('out');
    switching = false;
  }, 160);
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, stage.clientWidth); H = Math.max(1, stage.clientHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = clamp(Math.min(W / 390, H / 690), 0.75, 1.5);
  Object.values(SCENES).forEach(sc => sc.layout());
}

// Entrées tactiles / souris sur le canvas
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sound.unlock();
  const r = cv.getBoundingClientRect();
  scene().tap((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
});
document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// Mise en arrière-plan : on sauvegarde, puis on rattrape le temps au retour
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); return; }
  if (!hiddenAt) return;
  const sec = Math.min((Date.now() - hiddenAt) / 1000, CONFIG.offlineCapHours * 3600);
  hiddenAt = 0;
  if (sec > 2) {
    const gains = simulateOffline(sec);
    if (sec >= CONFIG.offlineMinSec) UI.showOffline(sec, gains);
  }
  last = performance.now();
});
window.addEventListener('pagehide', save);

let last = performance.now(), T = 0, uiAcc = 0, saveAcc = 0;
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now; T += dt;
  economyTick(dt, true);
  scene().update(dt);
  ctx.clearRect(0, 0, W, H);
  scene().draw(T);
  uiAcc += dt; if (uiAcc >= 0.2) { uiAcc = 0; UI.refresh(); }
  saveAcc += dt; if (saveAcc >= CONFIG.autosaveSec) { saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}

function init() {
  const loaded = load();
  state = loaded.state;
  buildIconImages();
  UI.init();
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener('resize', resize);

  TribeService.checkWeek();
  if (loaded.isNew) {
    UI.showWelcome();
  } else {
    const sec = Math.min((Date.now() - state.lastTime) / 1000, CONFIG.offlineCapHours * 3600);
    if (sec >= CONFIG.offlineMinSec) UI.showOffline(sec, simulateOffline(sec));
  }
  setScreen('village');
  save();
  last = performance.now();
  requestAnimationFrame(frame);
}
init();
</script>
